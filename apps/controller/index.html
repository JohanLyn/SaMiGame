<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1446" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SaMi Party</title>
  </head>
  <body>
    <section id="join-screen" class="screen">
      <div class="logo"><span class="logo-a">SaMi</span><span class="logo-b">PARTY</span></div>
      <form id="join-form" autocomplete="off">
        <label>
          Rumkode
          <input id="code-input" name="code" maxlength="4" autocapitalize="characters" spellcheck="false" placeholder="ABCD" required />
        </label>
        <label>
          Dit navn
          <input id="name-input" name="name" maxlength="12" placeholder="Turbo-Mormor" />
        </label>
        <button type="submit" id="join-button" class="btn btn-big">Hop ind!</button>
        <p id="join-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="game-screen" class="screen" hidden>
      <header id="bar">
        <img id="bar-avatar" alt="" />
        <span id="bar-name"></span>
        <span id="bar-status"></span>
      </header>
      <main id="layout"></main>
    </section>

    <div id="overlay" hidden><p id="overlay-text"></p></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
